name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://aperture:aperture@localhost:5432/aperture
      FRONTEND_ORIGIN: http://localhost:5173
      # Throwaway database the schema tests migrate forward and backward.
      TEST_DATABASE_URL: postgresql+asyncpg://aperture:aperture@localhost:5432/aperture_test
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aperture
          POSTGRES_PASSWORD: aperture
          POSTGRES_DB: aperture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aperture -d aperture_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Install dependencies (pinned Python 3.11)
        run: uv sync --python 3.11
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Mypy (strict types)
        run: uv run mypy --strict app tests
      - name: Import contracts
        run: uv run lint-imports
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check (tsc --noEmit)
        run: npm run typecheck
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://aperture:aperture@127.0.0.1:55432/aperture_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aperture
          POSTGRES_PASSWORD: aperture
          POSTGRES_DB: aperture_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U aperture -d aperture_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
