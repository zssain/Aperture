services:
  db:
    image: pgvector/pgvector:pg16
    container_name: aperture-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aperture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aperture}
      POSTGRES_DB: ${POSTGRES_DB:-aperture}
    ports:
      - "5432:5432"
    volumes:
      - aperture_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aperture} -d ${POSTGRES_DB:-aperture}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aperture_pgdata:
