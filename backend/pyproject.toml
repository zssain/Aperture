[project]
name = "aperture-backend"
version = "0.1.0"
description = "APERTURE credit decision system — backend API"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pypdf>=5.1",
    "python-multipart>=0.0.12",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "pgvector>=0.3.6",
    "boto3>=1.35",
    # HTTP client for the OpenAI/Gemini LLM providers — a runtime dep, so the lean
    # (no-extras) image can enable the LLM without a ModuleNotFoundError at import.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Training-only tooling (dataset acquisition). Not needed at inference time.
ml = [
    "ucimlrepo>=0.0.7",
]
embeddings = [
    "sentence-transformers>=3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "import-linter>=2.1",
    "hypothesis>=6.100",
]

[tool.uv]
# This is a runnable application, not a distributable library — do not build/install it.
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "tests"]
# Alembic revision files are generated artifacts; do not lint their formatting.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "N", "ASYNC", "RUF"]
# The queue's routed_because phrases carry a middle dot and a multiplication sign by design
# ("Verification ELEVATED / circular flow xN"); allow those two glyphs in string literals.
allowed-confusables = ["·", "×"]

[tool.ruff.lint.per-file-ignores]
# Notice copy is translated prose (English + Hindi); wrapping it would harm readability.
"app/services/notices/templates.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection defaults are the idiomatic pattern, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "app.api.deps.require_role",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

# The `ml/` package (dataset pipelines + the published scorecard) lives outside the
# backend and is imported at runtime with a sys.path insert; do not type-check it here.
[[tool.mypy.overrides]]
module = ["ml.*", "xgboost.*", "ucimlrepo.*", "joblib.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "sentence_transformers.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "app.main",
    "app.api",
    "app.db",
    "app.core",
]

[[tool.importlinter.contracts]]
# Invariant 5: fraud never reads risk (and never the other assessments either). The
# type signature already blocks passing a PD in; this stops an import-level leak too.
name = "Manipulation independence"
type = "forbidden"
source_modules = ["app.services.manipulation"]
forbidden_modules = [
    "app.services.risk",
    "app.services.coverage",
    "app.services.affordability",
]

[[tool.importlinter.contracts]]
name = "Cloud SDK boundary"
type = "forbidden"
source_modules = ["app"]
forbidden_modules = ["boto3", "botocore", "sentence_transformers"]
ignore_imports = [
    "app.core.providers.embeddings_bedrock -> boto3",
    "app.core.providers.embeddings_bedrock -> botocore",
    "app.core.providers.llm_bedrock -> boto3",
    "app.core.providers.llm_bedrock -> botocore",
    "app.core.providers.embeddings_local -> sentence_transformers",
    "app.core.secrets -> boto3",
]
